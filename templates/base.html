{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Purificadores PSA{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="{% static 'css/estilos.css' %}" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark navbar-psa sticky-top">
  <div class="container">
    <a class="navbar-brand fw-bold" href="{% url 'core:inicio' %}">💧 PSA</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="menu">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link" href="{% url 'core:inicio' %}">Inicio</a></li>
        <li class="nav-item"><a class="nav-link" href="{% url 'core:agua_y_salud' %}">Agua y salud</a></li>
        <li class="nav-item"><a class="nav-link" href="{% url 'core:equipos' %}">Nuestros equipos</a></li>
        <li class="nav-item"><a class="nav-link" href="{% url 'core:faq' %}">Preguntas frecuentes</a></li>
      </ul>
    </div>
  </div>
</nav>

<main>
  {% block contenido %}{% endblock %}
</main>

<footer class="footer-psa py-4 mt-5">
  <div class="container text-center">
    <p class="mb-1">💧 Purificadores PSA</p>
    <small>La información de este sitio es orientativa.</small>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
