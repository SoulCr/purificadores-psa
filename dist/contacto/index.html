<main>
  
  
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-lg-7">
      <h1 class="mb-3">Hablá con un asesor</h1>
      <p class="mb-4">Completá tus datos y se abrirá WhatsApp con tu consulta lista para enviar.</p>

      
      <form id="form-contacto">
        <div class="mb-3">
          <label class="form-label" for="nombre">Nombre</label>
          <input type="text" id="nombre" class="form-control" placeholder="Tu nombre" required>
        </div>
        <div class="mb-3">
          <label class="form-label" for="telefono">Teléfono (opcional)</label>
          <input type="text" id="telefono" class="form-control" placeholder="Para que podamos llamarte">
        </div>
        <div class="mb-3">
          <label class="form-label" for="mensaje">Consulta</label>
          <textarea id="mensaje" class="form-control" rows="5" placeholder="¿En qué podemos ayudarte?" required></textarea>
        </div>
        <button type="submit" class="btn btn-psa">Enviar por WhatsApp</button>
      </form>

      <script>
        document.getElementById('form-contacto').addEventListener('submit', function (e) {
          e.preventDefault();
          var nombre = document.getElementById('nombre').value.trim();
          var telefono = document.getElementById('telefono').value.trim();
          var mensaje = document.getElementById('mensaje').value.trim();
          var texto = 'Hola! Soy ' + nombre + '. ' + mensaje;
          if (telefono) { texto += ' Mi teléfono: ' + telefono; }
          window.open('https://wa.me/5492920628459?text=' + encodeURIComponent(texto), '_blank');
        });
      </script>
      
    </div>
  </div>
</div>
